<!DOCTYPE html>
<html>
<head>
    <title>LangChain PDF Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .chat-history {
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            margin-top: 20px;
        }
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }
        .human {
            background-color: #e3f2fd;
            margin-left: 20px;
        }
        .ai {
            background-color: #f5f5f5;
            margin-right: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .answer-box {
            background-color: #e8f5e9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">PDF Chat Assistant</h1>
        
        <form method="POST" enctype="multipart/form-data" class="mb-4">
            <div class="form-group">
                <label class="form-label">Upload PDF:</label>
                <input type="file" name="pdf" class="form-control" accept=".pdf">
            </div>
            
            <div class="form-group">
                <label class="form-label">Enter your question:</label>
                <input type="text" name="question" class="form-control" required placeholder="Ask a question about your PDF...">
            </div>
            
            <button type="submit" class="btn btn-primary">Ask Question</button>
        </form>

        {% if answer %}
            <div class="answer-box">
                <h4>Answer:</h4>
                <p class="mb-0">{{ answer }}</p>
            </div>
        {% endif %}

        {% if chat_history %}
            <div class="chat-history">
                <h4>Chat History</h4>
                {% for msg in chat_history %}
                    <div class="message {% if msg.type == 'human' %}human{% else %}ai{% endif %}">
                        <strong>{{ msg.type|title }}:</strong> {{ msg.content }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
